# Builds the static apps (Pantry, Wasiat-lite) and publishes them to GitHub Pages.
# The apps are plain files: everything they show is read from the chains in the visitor's browser.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "specs/**"
      - "site/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build both apps and the packages they use
        run: pnpm --filter "@potluck/pantry..." --filter "@potluck/wasiat..." build
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r apps/pantry/dist _site/pantry
          cp -r apps/wasiat/dist _site/wasiat
          cp site/index.html _site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
