# Builds the landing page, the static apps (Pantry, Wasiat-lite), the SDK example and the SDK as one
# ES module, and publishes them to GitHub Pages.
# Everything is plain files: the apps read what they show from the chains in the visitor's browser.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "specs/**"
      - "examples/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build both apps, the SDK example and the packages they use
        run: pnpm --filter "@potluck/pantry..." --filter "@potluck/wasiat..." --filter "@potluck/example-minimal..." build
      - name: Bundle the SDK as one ES module for use from a URL
        run: pnpm --filter @potluck/client build:cdn
      - name: Export the landing page for the /potluck/ base path
        run: pnpm --filter @potluck/landing build
        env:
          NEXT_BASE_PATH: /potluck
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r apps/landing/out/. _site/
          cp -r apps/pantry/dist _site/pantry
          cp -r apps/wasiat/dist _site/wasiat
          cp -r examples/minimal/dist _site/example
          mkdir -p _site/sdk
          cp packages/client/dist-cdn/potluck.js packages/client/dist-cdn/potluck.js.map _site/sdk/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
